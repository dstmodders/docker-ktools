name: Build

on:
  push:
    branches:
      - develop
      - main
    paths:
      - 'latest/**'
      - 'official/**'
      - .github/workflows/build.yml
      - versions.json
  workflow_dispatch:

env:
  DOCKERHUB_REPOSITORY: ${{ github.repository_owner }}/ktools
  SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL }}
  SLACK_SIGNING_SECRET: ${{ secrets.SLACK_SIGNING_SECRET }}
  SLACK_TOKEN: ${{ secrets.SLACK_TOKEN }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      latest: ${{ steps.set-matrix.outputs.latest }}
      official: ${{ steps.set-matrix.outputs.official }}
      latest-fields-pending: ${{ steps.set-matrix.outputs.latest-fields-pending }}
      official-fields-pending: ${{ steps.set-matrix.outputs.official-fields-pending }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set matrix
        id: set-matrix
        run: |
          json="$(cat ./versions.json)"
          {
            echo "latest=$(jq -cM .latest <<< "$json")"
            echo "official=$(jq -cM .official <<< "$json")"
            echo "latest-fields-pending<<EOF"
            jq -r '.latest[] | "ktools \(.version) / IM \(.imagemagick_version): Pending..."' <<< "$json"
            echo "EOF"
            echo "official-fields-pending<<EOF"
            jq -r '.official[] | "ktools \(.version) / IM \(.imagemagick_version): Pending..."' <<< "$json"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  build-official-notify:
    needs: prepare
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' }}
    outputs:
      slack-timestamp: ${{ steps.slack.outputs.slack-timestamp }}
    steps:
      - name: Send Slack notification
        uses: codedsolar/slack-action@7747edbf087b4facb2726870a34a1f174314b5ae # v1.5.0
        id: slack
        with:
          text: GitHub Actions <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|${{ github.workflow }} / build-official> job in {GITHUB_REF} by {GITHUB_ACTOR}
          fields: |
            {STATUS}
            {REF}
            ${{ needs.prepare.outputs.official-fields-pending }}
          status: in-progress

  build-official:
    needs: [prepare, build-official-notify]
    runs-on: ubuntu-latest
    if: ${{ always() && needs.prepare.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.prepare.outputs.official) }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: tonistiigi/binfmt:qemu-v10.2.3-68
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Login to private registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ secrets.PRIVATE_REGISTRY_HOST }}
          username: ${{ secrets.PRIVATE_REGISTRY_USERNAME }}
          password: ${{ secrets.PRIVATE_REGISTRY_PASSWORD }}
      - name: Build a Debian image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: debian
        with:
          build-args: |
            IMAGEMAGICK_IMAGE_PREFIX=${{ matrix.image.imagemagick_legacy && 'legacy-' || '' }}
            IMAGEMAGICK_VERSION=${{ matrix.image.imagemagick_version }}
            KTOOLS_VERSION=${{ matrix.image.version }}
          cache-from: type=registry,ref=${{ secrets.PRIVATE_REGISTRY_HOST }}/ktools:cache-official-${{ matrix.image.version }}-debian
          cache-to: type=registry,ref=${{ secrets.PRIVATE_REGISTRY_HOST }}/ktools:cache-official-${{ matrix.image.version }}-debian,mode=max
          context: .
          file: ./official/debian/Dockerfile
          labels: maintainer=victor@popkov.me
          platforms: linux/amd64,linux/386
          provenance: false
          pull: true
          push: true
          sbom: false
          tags: |
            ${{ secrets.PRIVATE_REGISTRY_HOST }}/ktools:official-${{ matrix.image.version }}-debian
      - name: Build an Alpine image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: alpine
        with:
          build-args: |
            IMAGEMAGICK_IMAGE_PREFIX=${{ matrix.image.imagemagick_legacy && 'legacy-' || '' }}
            IMAGEMAGICK_VERSION=${{ matrix.image.imagemagick_version }}
            KTOOLS_VERSION=${{ matrix.image.version }}
          cache-from: type=registry,ref=${{ secrets.PRIVATE_REGISTRY_HOST }}/ktools:cache-official-${{ matrix.image.version }}-alpine
          cache-to: type=registry,ref=${{ secrets.PRIVATE_REGISTRY_HOST }}/ktools:cache-official-${{ matrix.image.version }}-alpine,mode=max
          context: .
          file: ./official/alpine/Dockerfile
          labels: maintainer=victor@popkov.me
          platforms: linux/amd64,linux/386
          provenance: false
          pull: true
          push: true
          sbom: false
          tags: |
            ${{ secrets.PRIVATE_REGISTRY_HOST }}/ktools:official-${{ matrix.image.version }}-alpine
      - name: Update Slack notification
        uses: codedsolar/slack-action@7747edbf087b4facb2726870a34a1f174314b5ae # v1.5.0
        if: ${{ always() && needs.build-official-notify.outputs.slack-timestamp != '' }}
        continue-on-error: true
        with:
          text: GitHub Actions <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|${{ github.workflow }} / build-official> job in {GITHUB_REF} by {GITHUB_ACTOR}
          fields-mode: merge
          ignore-failures: true
          preserve-color: true
          fields: |
            ktools ${{ matrix.image.version }} / IM ${{ matrix.image.imagemagick_version }}: ${{ job.status == 'success' && 'Success' || job.status == 'cancelled' && 'Cancelled' || job.status == 'skipped' && 'Skipped' || 'Failure' }}
          timestamp: ${{ needs.build-official-notify.outputs.slack-timestamp }}
      - name: Save Slack field outcome
        if: ${{ always() }}
        run: |
          case "${{ job.status }}" in
            success) value=Success ;;
            cancelled) value=Cancelled ;;
            skipped) value=Skipped ;;
            *) value=Failure ;;
          esac
          mkdir -p .slack-field
          printf 'ktools %s / IM %s: %s\n' \
            '${{ matrix.image.version }}' \
            '${{ matrix.image.imagemagick_version }}' \
            "$value" > .slack-field/field.txt
      - name: Upload Slack field outcome
        if: ${{ always() && needs.build-official-notify.outputs.slack-timestamp != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: slack-field-build-official-${{ matrix.image.version }}
          path: .slack-field/field.txt
          if-no-files-found: error
          retention-days: 1

  build-official-finalize:
    needs: [build-official-notify, build-official]
    runs-on: ubuntu-latest
    if: ${{ always() && needs.build-official-notify.result == 'success' }}
    steps:
      - name: Download Slack field outcomes
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: slack-field-build-official-*
          path: slack-fields
      - name: Assemble Slack fields
        id: fields
        run: |
          {
            echo 'fields<<EOF'
            find slack-fields -type f -name field.txt | sort | while read -r f; do cat "$f"; done
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Finalize Slack notification
        uses: codedsolar/slack-action@7747edbf087b4facb2726870a34a1f174314b5ae # v1.5.0
        with:
          text: GitHub Actions <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|${{ github.workflow }} / build-official> job in {GITHUB_REF} by {GITHUB_ACTOR}
          color: ${{ needs.build-official.result == 'success' && '#24a943' || needs.build-official.result == 'cancelled' && '#1f242b' || '#cc1f2d' }}
          fields: |
            {STATUS}
            {REF}
            ${{ steps.fields.outputs.fields }}
          status: ${{ needs.build-official.result == 'success' && 'success' || needs.build-official.result == 'cancelled' && 'cancelled' || 'failure' }}
          timestamp: ${{ needs.build-official-notify.outputs.slack-timestamp }}

  build-latest-notify:
    needs: prepare
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' }}
    outputs:
      slack-timestamp: ${{ steps.slack.outputs.slack-timestamp }}
    steps:
      - name: Send Slack notification
        uses: codedsolar/slack-action@7747edbf087b4facb2726870a34a1f174314b5ae # v1.5.0
        id: slack
        with:
          text: GitHub Actions <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|${{ github.workflow }} / build-latest> job in {GITHUB_REF} by {GITHUB_ACTOR}
          fields: |
            {STATUS}
            {REF}
            ${{ needs.prepare.outputs.latest-fields-pending }}
          status: in-progress

  build-latest:
    needs: [prepare, build-latest-notify]
    runs-on: ubuntu-latest
    if: ${{ always() && needs.prepare.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.prepare.outputs.latest) }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: tonistiigi/binfmt:qemu-v10.2.3-68
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Login to private registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ secrets.PRIVATE_REGISTRY_HOST }}
          username: ${{ secrets.PRIVATE_REGISTRY_USERNAME }}
          password: ${{ secrets.PRIVATE_REGISTRY_PASSWORD }}
      - name: Build a Debian image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: debian
        with:
          build-args: |
            IMAGEMAGICK_IMAGE_PREFIX=${{ matrix.image.imagemagick_legacy && 'legacy-' || '' }}
            IMAGEMAGICK_VERSION=${{ matrix.image.imagemagick_version }}
            KTOOLS_VERSION=${{ matrix.image.version }}
          cache-from: type=registry,ref=${{ secrets.PRIVATE_REGISTRY_HOST }}/ktools:cache-${{ matrix.image.version }}-debian
          cache-to: type=registry,ref=${{ secrets.PRIVATE_REGISTRY_HOST }}/ktools:cache-${{ matrix.image.version }}-debian,mode=max
          context: .
          file: ./latest/debian/Dockerfile
          labels: maintainer=victor@popkov.me
          platforms: linux/amd64,linux/386
          provenance: false
          pull: true
          push: true
          sbom: false
          tags: |
            ${{ secrets.PRIVATE_REGISTRY_HOST }}/ktools:${{ matrix.image.version }}-debian
      - name: Build an Alpine image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: alpine
        with:
          build-args: |
            IMAGEMAGICK_IMAGE_PREFIX=${{ matrix.image.imagemagick_legacy && 'legacy-' || '' }}
            IMAGEMAGICK_VERSION=${{ matrix.image.imagemagick_version }}
            KTOOLS_VERSION=${{ matrix.image.version }}
          cache-from: type=registry,ref=${{ secrets.PRIVATE_REGISTRY_HOST }}/ktools:cache-${{ matrix.image.version }}-alpine
          cache-to: type=registry,ref=${{ secrets.PRIVATE_REGISTRY_HOST }}/ktools:cache-${{ matrix.image.version }}-alpine,mode=max
          context: .
          file: ./latest/alpine/Dockerfile
          labels: maintainer=victor@popkov.me
          platforms: linux/amd64,linux/386
          provenance: false
          pull: true
          push: true
          sbom: false
          tags: |
            ${{ secrets.PRIVATE_REGISTRY_HOST }}/ktools:${{ matrix.image.version }}-alpine
      - name: Update Slack notification
        uses: codedsolar/slack-action@7747edbf087b4facb2726870a34a1f174314b5ae # v1.5.0
        if: ${{ always() && needs.build-latest-notify.outputs.slack-timestamp != '' }}
        continue-on-error: true
        with:
          text: GitHub Actions <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|${{ github.workflow }} / build-latest> job in {GITHUB_REF} by {GITHUB_ACTOR}
          fields-mode: merge
          ignore-failures: true
          preserve-color: true
          fields: |
            ktools ${{ matrix.image.version }} / IM ${{ matrix.image.imagemagick_version }}: ${{ job.status == 'success' && 'Success' || job.status == 'cancelled' && 'Cancelled' || job.status == 'skipped' && 'Skipped' || 'Failure' }}
          timestamp: ${{ needs.build-latest-notify.outputs.slack-timestamp }}
      - name: Save Slack field outcome
        if: ${{ always() }}
        run: |
          case "${{ job.status }}" in
            success) value=Success ;;
            cancelled) value=Cancelled ;;
            skipped) value=Skipped ;;
            *) value=Failure ;;
          esac
          mkdir -p .slack-field
          printf 'ktools %s / IM %s: %s\n' \
            '${{ matrix.image.version }}' \
            '${{ matrix.image.imagemagick_version }}' \
            "$value" > .slack-field/field.txt
      - name: Upload Slack field outcome
        if: ${{ always() && needs.build-latest-notify.outputs.slack-timestamp != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: slack-field-build-latest-${{ matrix.image.version }}
          path: .slack-field/field.txt
          if-no-files-found: error
          retention-days: 1

  build-latest-finalize:
    needs: [build-latest-notify, build-latest]
    runs-on: ubuntu-latest
    if: ${{ always() && needs.build-latest-notify.result == 'success' }}
    steps:
      - name: Download Slack field outcomes
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: slack-field-build-latest-*
          path: slack-fields
      - name: Assemble Slack fields
        id: fields
        run: |
          {
            echo 'fields<<EOF'
            find slack-fields -type f -name field.txt | sort | while read -r f; do cat "$f"; done
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Finalize Slack notification
        uses: codedsolar/slack-action@7747edbf087b4facb2726870a34a1f174314b5ae # v1.5.0
        with:
          text: GitHub Actions <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|${{ github.workflow }} / build-latest> job in {GITHUB_REF} by {GITHUB_ACTOR}
          color: ${{ needs.build-latest.result == 'success' && '#24a943' || needs.build-latest.result == 'cancelled' && '#1f242b' || '#cc1f2d' }}
          fields: |
            {STATUS}
            {REF}
            ${{ steps.fields.outputs.fields }}
          status: ${{ needs.build-latest.result == 'success' && 'success' || needs.build-latest.result == 'cancelled' && 'cancelled' || 'failure' }}
          timestamp: ${{ needs.build-latest-notify.outputs.slack-timestamp }}

  push-official-notify:
    needs: [prepare, build-official]
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    outputs:
      slack-timestamp: ${{ steps.slack.outputs.slack-timestamp }}
    steps:
      - name: Send Slack notification
        uses: codedsolar/slack-action@7747edbf087b4facb2726870a34a1f174314b5ae # v1.5.0
        id: slack
        with:
          text: GitHub Actions <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|${{ github.workflow }} / push-official> job in {GITHUB_REF} by {GITHUB_ACTOR}
          fields: |
            {STATUS}
            {REF}
            ${{ needs.prepare.outputs.official-fields-pending }}
          status: in-progress

  push-official:
    needs: [prepare, build-official, push-official-notify]
    runs-on: ubuntu-latest
    if: ${{ always() && github.ref == 'refs/heads/main' && needs.build-official.result == 'success' }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        image: ${{ fromJSON(needs.prepare.outputs.official) }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: tonistiigi/binfmt:qemu-v10.2.3-68
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Login to private registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ secrets.PRIVATE_REGISTRY_HOST }}
          username: ${{ secrets.PRIVATE_REGISTRY_USERNAME }}
          password: ${{ secrets.PRIVATE_REGISTRY_PASSWORD }}
      - name: Login to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}
      - name: Prepare Docker meta for a Debian image
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: debian-meta
        with:
          flavor: prefix=official-,onlatest=true
          images: |
            ${{ env.DOCKERHUB_REPOSITORY }}
            ghcr.io/${{ env.DOCKERHUB_REPOSITORY }}
          labels: maintainer=victor@popkov.me
          tags: |
            type=raw,value=${{ matrix.image.version }}-imagemagick-${{ matrix.image.imagemagick_version }}-debian
            type=raw,value=${{ matrix.image.version }}-debian
            type=raw,value=${{ matrix.image.version }}
            ${{ matrix.image.latest && 'type=raw,value=debian' || '' }}
      - name: Build a Debian image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          build-args: |
            IMAGEMAGICK_IMAGE_PREFIX=${{ matrix.image.imagemagick_legacy && 'legacy-' || '' }}
            IMAGEMAGICK_VERSION=${{ matrix.image.imagemagick_version }}
            KTOOLS_VERSION=${{ matrix.image.version }}
          cache-from: type=registry,ref=${{ secrets.PRIVATE_REGISTRY_HOST }}/ktools:cache-official-${{ matrix.image.version }}-debian
          context: .
          file: ./official/debian/Dockerfile
          labels: ${{ steps.debian-meta.outputs.labels }}
          platforms: linux/amd64,linux/386
          provenance: false
          pull: true
          push: ${{ !env.ACT }}
          sbom: false
          tags: ${{ steps.debian-meta.outputs.tags }}
      - name: Prepare Docker meta for an Alpine image
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: alpine-meta
        with:
          images: |
            ${{ env.DOCKERHUB_REPOSITORY }}
            ghcr.io/${{ env.DOCKERHUB_REPOSITORY }}
          flavor: |
            latest=${{ matrix.image.latest || 'false' }}
            prefix=official-,onlatest=true
          labels: maintainer=victor@popkov.me
          tags: |
            type=raw,value=${{ matrix.image.version }}-imagemagick-${{ matrix.image.imagemagick_version }}-alpine
            type=raw,value=${{ matrix.image.version }}-alpine
            type=raw,value=${{ matrix.image.version }}
            ${{ matrix.image.latest && 'type=raw,value=alpine' || '' }}
            ${{ matrix.image.latest && 'type=raw,prefix=,value=official' || '' }}
      - name: Build an Alpine image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          build-args: |
            IMAGEMAGICK_IMAGE_PREFIX=${{ matrix.image.imagemagick_legacy && 'legacy-' || '' }}
            IMAGEMAGICK_VERSION=${{ matrix.image.imagemagick_version }}
            KTOOLS_VERSION=${{ matrix.image.version }}
          cache-from: type=registry,ref=${{ secrets.PRIVATE_REGISTRY_HOST }}/ktools:cache-official-${{ matrix.image.version }}-alpine
          context: .
          file: ./official/alpine/Dockerfile
          labels: ${{ steps.alpine-meta.outputs.labels }}
          platforms: linux/amd64,linux/386
          provenance: false
          pull: true
          push: ${{ !env.ACT }}
          sbom: false
          tags: ${{ steps.alpine-meta.outputs.tags }}
      - name: Update Slack notification
        uses: codedsolar/slack-action@7747edbf087b4facb2726870a34a1f174314b5ae # v1.5.0
        if: ${{ always() && needs.push-official-notify.outputs.slack-timestamp != '' }}
        continue-on-error: true
        with:
          text: GitHub Actions <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|${{ github.workflow }} / push-official> job in {GITHUB_REF} by {GITHUB_ACTOR}
          fields-mode: merge
          ignore-failures: true
          preserve-color: true
          fields: |
            ktools ${{ matrix.image.version }} / IM ${{ matrix.image.imagemagick_version }}: ${{ job.status == 'success' && 'Success' || job.status == 'cancelled' && 'Cancelled' || job.status == 'skipped' && 'Skipped' || 'Failure' }}
          timestamp: ${{ needs.push-official-notify.outputs.slack-timestamp }}
      - name: Save Slack field outcome
        if: ${{ always() }}
        run: |
          case "${{ job.status }}" in
            success) value=Success ;;
            cancelled) value=Cancelled ;;
            skipped) value=Skipped ;;
            *) value=Failure ;;
          esac
          mkdir -p .slack-field
          printf 'ktools %s / IM %s: %s\n' \
            '${{ matrix.image.version }}' \
            '${{ matrix.image.imagemagick_version }}' \
            "$value" > .slack-field/field.txt
      - name: Upload Slack field outcome
        if: ${{ always() && needs.push-official-notify.outputs.slack-timestamp != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: slack-field-push-official-${{ matrix.image.version }}
          path: .slack-field/field.txt
          if-no-files-found: error
          retention-days: 1

  push-official-finalize:
    needs: [push-official-notify, push-official]
    runs-on: ubuntu-latest
    if: ${{ always() && needs.push-official-notify.result == 'success' }}
    steps:
      - name: Download Slack field outcomes
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: slack-field-push-official-*
          path: slack-fields
      - name: Assemble Slack fields
        id: fields
        run: |
          {
            echo 'fields<<EOF'
            find slack-fields -type f -name field.txt | sort | while read -r f; do cat "$f"; done
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Finalize Slack notification
        uses: codedsolar/slack-action@7747edbf087b4facb2726870a34a1f174314b5ae # v1.5.0
        with:
          text: GitHub Actions <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|${{ github.workflow }} / push-official> job in {GITHUB_REF} by {GITHUB_ACTOR}
          color: ${{ needs.push-official.result == 'success' && '#24a943' || needs.push-official.result == 'cancelled' && '#1f242b' || '#cc1f2d' }}
          fields: |
            {STATUS}
            {REF}
            ${{ steps.fields.outputs.fields }}
          status: ${{ needs.push-official.result == 'success' && 'success' || needs.push-official.result == 'cancelled' && 'cancelled' || 'failure' }}
          timestamp: ${{ needs.push-official-notify.outputs.slack-timestamp }}

  push-latest-notify:
    needs: [prepare, build-latest, push-official]
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    outputs:
      slack-timestamp: ${{ steps.slack.outputs.slack-timestamp }}
    steps:
      - name: Send Slack notification
        uses: codedsolar/slack-action@7747edbf087b4facb2726870a34a1f174314b5ae # v1.5.0
        id: slack
        with:
          text: GitHub Actions <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|${{ github.workflow }} / push-latest> job in {GITHUB_REF} by {GITHUB_ACTOR}
          fields: |
            {STATUS}
            {REF}
            ${{ needs.prepare.outputs.latest-fields-pending }}
          status: in-progress

  push-latest:
    needs: [prepare, build-latest, push-official, push-latest-notify]
    runs-on: ubuntu-latest
    if: ${{ always() && github.ref == 'refs/heads/main' && needs.build-latest.result == 'success' && needs.push-official.result == 'success' }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        image: ${{ fromJSON(needs.prepare.outputs.latest) }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: tonistiigi/binfmt:qemu-v10.2.3-68
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Login to private registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ secrets.PRIVATE_REGISTRY_HOST }}
          username: ${{ secrets.PRIVATE_REGISTRY_USERNAME }}
          password: ${{ secrets.PRIVATE_REGISTRY_PASSWORD }}
      - name: Login to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}
      - name: Prepare Docker meta for a Debian image
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: debian-meta
        with:
          images: |
            ${{ env.DOCKERHUB_REPOSITORY }}
            ghcr.io/${{ env.DOCKERHUB_REPOSITORY }}
          labels: maintainer=victor@popkov.me
          tags: |
            type=raw,value=${{ matrix.image.version }}-imagemagick-${{ matrix.image.imagemagick_version }}-debian
            type=raw,value=${{ matrix.image.version }}-debian
            type=raw,value=${{ matrix.image.version }}
            ${{ matrix.image.latest && 'type=raw,value=debian' || '' }}
      - name: Build a Debian image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          build-args: |
            IMAGEMAGICK_IMAGE_PREFIX=${{ matrix.image.imagemagick_legacy && 'legacy-' || '' }}
            IMAGEMAGICK_VERSION=${{ matrix.image.imagemagick_version }}
            KTOOLS_VERSION=${{ matrix.image.version }}
          cache-from: type=registry,ref=${{ secrets.PRIVATE_REGISTRY_HOST }}/ktools:cache-${{ matrix.image.version }}-debian
          context: .
          file: ./latest/debian/Dockerfile
          labels: ${{ steps.debian-meta.outputs.labels }}
          platforms: linux/amd64,linux/386
          provenance: false
          pull: true
          push: ${{ !env.ACT }}
          sbom: false
          tags: ${{ steps.debian-meta.outputs.tags }}
      - name: Prepare Docker meta for an Alpine image
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: alpine-meta
        with:
          images: |
            ${{ env.DOCKERHUB_REPOSITORY }}
            ghcr.io/${{ env.DOCKERHUB_REPOSITORY }}
          flavor: latest=${{ matrix.image.latest || 'false' }}
          labels: maintainer=victor@popkov.me
          tags: |
            type=raw,value=${{ matrix.image.version }}-imagemagick-${{ matrix.image.imagemagick_version }}-alpine
            type=raw,value=${{ matrix.image.version }}-alpine
            type=raw,value=${{ matrix.image.version }}
            ${{ matrix.image.latest && 'type=raw,value=alpine' || '' }}
      - name: Build an Alpine image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          build-args: |
            IMAGEMAGICK_IMAGE_PREFIX=${{ matrix.image.imagemagick_legacy && 'legacy-' || '' }}
            IMAGEMAGICK_VERSION=${{ matrix.image.imagemagick_version }}
            KTOOLS_VERSION=${{ matrix.image.version }}
          cache-from: type=registry,ref=${{ secrets.PRIVATE_REGISTRY_HOST }}/ktools:cache-${{ matrix.image.version }}-alpine
          context: .
          file: ./latest/alpine/Dockerfile
          labels: ${{ steps.alpine-meta.outputs.labels }}
          platforms: linux/amd64,linux/386
          provenance: false
          pull: true
          push: ${{ !env.ACT }}
          sbom: false
          tags: ${{ steps.alpine-meta.outputs.tags }}
      - name: Update Slack notification
        uses: codedsolar/slack-action@7747edbf087b4facb2726870a34a1f174314b5ae # v1.5.0
        if: ${{ always() && needs.push-latest-notify.outputs.slack-timestamp != '' }}
        continue-on-error: true
        with:
          text: GitHub Actions <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|${{ github.workflow }} / push-latest> job in {GITHUB_REF} by {GITHUB_ACTOR}
          fields-mode: merge
          ignore-failures: true
          preserve-color: true
          fields: |
            ktools ${{ matrix.image.version }} / IM ${{ matrix.image.imagemagick_version }}: ${{ job.status == 'success' && 'Success' || job.status == 'cancelled' && 'Cancelled' || job.status == 'skipped' && 'Skipped' || 'Failure' }}
          timestamp: ${{ needs.push-latest-notify.outputs.slack-timestamp }}
      - name: Save Slack field outcome
        if: ${{ always() }}
        run: |
          case "${{ job.status }}" in
            success) value=Success ;;
            cancelled) value=Cancelled ;;
            skipped) value=Skipped ;;
            *) value=Failure ;;
          esac
          mkdir -p .slack-field
          printf 'ktools %s / IM %s: %s\n' \
            '${{ matrix.image.version }}' \
            '${{ matrix.image.imagemagick_version }}' \
            "$value" > .slack-field/field.txt
      - name: Upload Slack field outcome
        if: ${{ always() && needs.push-latest-notify.outputs.slack-timestamp != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: slack-field-push-latest-${{ matrix.image.version }}
          path: .slack-field/field.txt
          if-no-files-found: error
          retention-days: 1

  push-latest-finalize:
    needs: [push-latest-notify, push-latest]
    runs-on: ubuntu-latest
    if: ${{ always() && needs.push-latest-notify.result == 'success' }}
    steps:
      - name: Download Slack field outcomes
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: slack-field-push-latest-*
          path: slack-fields
      - name: Assemble Slack fields
        id: fields
        run: |
          {
            echo 'fields<<EOF'
            find slack-fields -type f -name field.txt | sort | while read -r f; do cat "$f"; done
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Finalize Slack notification
        uses: codedsolar/slack-action@7747edbf087b4facb2726870a34a1f174314b5ae # v1.5.0
        with:
          text: GitHub Actions <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|${{ github.workflow }} / push-latest> job in {GITHUB_REF} by {GITHUB_ACTOR}
          color: ${{ needs.push-latest.result == 'success' && '#24a943' || needs.push-latest.result == 'cancelled' && '#1f242b' || '#cc1f2d' }}
          fields: |
            {STATUS}
            {REF}
            ${{ steps.fields.outputs.fields }}
          status: ${{ needs.push-latest.result == 'success' && 'success' || needs.push-latest.result == 'cancelled' && 'cancelled' || 'failure' }}
          timestamp: ${{ needs.push-latest-notify.outputs.slack-timestamp }}
